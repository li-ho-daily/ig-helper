 <!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IG 上架小幫手</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #fafafa; color: #262626; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 600px; width: 100%; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid #dbdbdb; }
        h1 { font-size: 24px; color: #262626; text-align: center; margin-bottom: 5px; font-weight: 600; }
        .subtitle { text-align: center; color: #8e8e8e; font-size: 14px; margin-bottom: 25px; }
        .section { background: #fff; border: 1px solid #dbdbdb; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .section-title { font-size: 16px; font-weight: 600; margin-top: 0; margin-bottom: 15px; display: flex; align-items: center; color: #262626; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #262626; font-size: 14px; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 10px; border: 1px solid #dbdbdb; border-radius: 6px; box-sizing: border-box; font-size: 14px; background-color: #fafafa; }
        input:focus, textarea:focus { outline: none; border-color: #a8a8a8; background-color: #fff; }
        .price-row { display: flex; gap: 15px; }
        .price-row .form-group { flex: 1; margin-bottom: 0; }
        button { width: 100%; padding: 12px; background-color: #0095f6; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: 600; transition: background-color 0.2s; }
        button:hover { background-color: #1877f2; }
        .btn-secondary { background-color: #efefef; color: #262626; margin-top: 8px; padding: 8px; font-size: 13px; }
        .btn-secondary:hover { background-color: #dbdbdb; }
        .upload-area { border: 2px dashed #dbdbdb; padding: 30px; text-align: center; border-radius: 8px; background: #fafafa; cursor: pointer; transition: all 0.2s; }
        .upload-area:hover { background: #f2f2f2; border-color: #a8a8a8; }
        .result-box { margin-top: 25px; padding: 20px; background-color: #fafafa; border: 1px solid #dbdbdb; border-radius: 8px; display: none; }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #dbdbdb; padding-bottom: 10px; }
        .copy-btn { width: auto; padding: 6px 12px; font-size: 13px; background-color: #0095f6; }
        pre { white-space: pre-wrap; word-wrap: break-word; margin: 0; font-family: inherit; font-size: 14px; line-height: 1.6; color: #262626; }
        .status { margin-top: 15px; text-align: center; font-size: 14px; font-weight: 600; color: #262626; }
        .hint { font-size: 12px; color: #8e8e8e; margin-top: 4px; line-height: 1.4; }
        .preview-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .preview-img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid #dbdbdb; }
    </style>
</head>
<body>

<div class="container">
    <h1>✦ IG 上架小幫手 ✦</h1>
    <div class="subtitle">上傳日本網站截圖，自動生成 IG 文案</div>
    
    <div class="section">
        <div class="section-title">🔑 Gemini API 金鑰</div>
        <div class="form-group" style="margin-bottom: 8px;">
            <input type="text" id="apiKey" placeholder="請貼上你的 AQ.Ab8R... 金鑰">
        </div>
        <button class="btn-secondary" onclick="saveApiKey()">儲存金鑰</button>
        <span id="keyStatus" style="font-size: 12px; color: green; margin-left: 10px; display:none;">✓ 金鑰已儲存</span>
    </div>

    <div class="section">
        <div class="section-title">📊 Google Sheet 自動記錄（選用）</div>
        <div class="form-group" style="margin-bottom: 8px;">
            <input type="text" id="sheetUrl" placeholder="請貼上你的 Google Apps Script 部署網址">
        </div>
        <button class="btn-secondary" onclick="saveSheetUrl()">儲存網址</button>
        <span id="sheetStatus" style="font-size: 12px; color: green; margin-left: 10px; display:none;">✓ 網址已儲存</span>
    </div>

    <div class="section">
        <div class="section-title">📸 上傳商品截圖</div>
        <div class="upload-area" onclick="document.getElementById('imageInput').click()">
            <h3 style="margin: 0 0 10px 0;">點擊或拖曳上傳截圖</h3>
            <div class="hint">支援 JPG、PNG、WEBP・可一次上傳多張</div>
            <input type="file" id="imageInput" accept="image/*" multiple style="display: none;" onchange="handleFiles(this.files)">
        </div>
        <div class="preview-container" id="previewContainer"></div>
    </div>

    <div class="section">
        <div class="section-title">✦ 補充資訊（選填）</div>
        <div class="price-row form-group">
            <div class="form-group">
                <label for="jpyPrice">日幣原價（¥）</label>
                <input type="number" id="jpyPrice" placeholder="例：2990" oninput="calculateTwd()">
            </div>
            <div class="form-group">
                <label for="twdPrice">台幣售價（NT$）</label>
                <input type="number" id="twdPrice" placeholder="自動計算或自訂">
            </div>
        </div>
        <div class="hint" style="margin-bottom: 15px;">* 輸入日幣後會自動依 0.3 匯率無條件進位計算台幣售價</div>
        
        <div class="form-group">
            <label for="itemName">商品名稱（中文）</label>
            <input type="text" id="itemName" placeholder="例：奶油色針織毛衣">
        </div>
        <div class="form-group">
            <label for="itemSizes">尺寸（空格分隔）</label>
            <input type="text" id="itemSizes" placeholder="例：S M L XL Free">
        </div>
        <div class="form-group">
            <label for="itemNotes">備註（顏色、材質、備貨天數等）</label>
            <textarea id="itemNotes" rows="3" placeholder="在這裡貼上日本商品原始網址，或輸入其他補充說明..."></textarea>
        </div>
    </div>

    <button id="generateBtn" onclick="generateContent()">✦ 生成 IG 文案</button>

    <div class="status" id="statusMsg"></div>

    <div class="result-box" id="resultBox">
        <div class="result-header">
            <strong style="font-size: 16px;">✨ 產出的日系文案 ✨</strong>
            <button class="copy-btn" onclick="copyText()">📋 一鍵複製</button>
        </div>
        <div style="background: white; padding: 15px; border: 1px solid #dbdbdb; border-radius: 6px;">
            <pre id="outputText"></pre>
        </div>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx-bmbn0nlOBLDqfuXrjtonqUs_Ld-hHR9_vBQ2JTee-hvmGniTo86nNXekJ3cEfw9c/exec";
    let selectedFiles = [];

    window.onload = function() {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
            document.getElementById('keyStatus').style.display = 'inline';
        }
        const savedSheet = localStorage.getItem('sheet_url') || WEB_APP_URL;
        if (savedSheet) {
            document.getElementById('sheetUrl').value = savedSheet;
            document.getElementById('sheetStatus').style.display = 'inline';
        }
    };

    function saveApiKey() {
        const key = document.getElementById('apiKey').value.trim();
        localStorage.setItem('gemini_api_key', key);
        document.getElementById('keyStatus').style.display = 'inline';
        alert('金鑰儲存成功！');
    }

    function saveSheetUrl() {
        const url = document.getElementById('sheetUrl').value.trim();
        localStorage.setItem('sheet_url', url);
        document.getElementById('sheetStatus').style.display = 'inline';
        alert('試算表網址儲存成功！');
    }

    function calculateTwd() {
        const jpy = parseFloat(document.getElementById('jpyPrice').value);
        if (jpy) {
            document.getElementById('twdPrice').value = Math.ceil(jpy * 0.3);
        } else {
            document.getElementById('twdPrice').value = '';
        }
    }

    function handleFiles(files) {
        const container = document.getElementById('previewContainer');
        container.innerHTML = '';
        selectedFiles = Array.from(files);
        
        selectedFiles.forEach(file => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.className = 'preview-img';
                container.appendChild(img);
            }
            reader.readAsDataURL(file);
        });
    }

    async function generateContent() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const sheetUrl = document.getElementById('sheetUrl').value.trim();
        const jpyPrice = document.getElementById('jpyPrice').value.trim();
        const twdPrice = document.getElementById('twdPrice').value.trim();
        const itemName = document.getElementById('itemName').value.trim();
        const itemSizes = document.getElementById('itemSizes').value.trim();
        const itemNotes = document.getElementById('itemNotes').value.trim();
        
        const statusMsg = document.getElementById('statusMsg');
        const resultBox = document.getElementById('resultBox');
        const outputText = document.getElementById('outputText');

        if (!apiKey) return alert('請先輸入並儲存 Gemini API Key！');
        if (selectedFiles.length === 0) return alert('請至少上傳一張商品截圖！');

        statusMsg.style.color = '#262626';
        statusMsg.innerText = '🔮 AI 正在閱讀圖片並構思日系文案中...';
        resultBox.style.display = 'none';

        const file = selectedFiles[0];
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onloadend = async function() {
            const base64Image = reader.result.split(',')[1];
            const mimeType = file.type;

            const prompt = `你是一位專業的日系清新風格服飾選品闆娘。請根據這張衣服截圖，以及我提供給你的補充資訊，幫我撰寫一篇溫柔、清新質感、像在跟朋友分享好物的繁體中文 IG 上架貼文。

輸入的已知資訊：
- 商品名稱：${itemName ? itemName : '（請由 AI 根據圖片與備註自由發想一個合適的日系商品名稱）'}
- 日幣原價：¥${jpyPrice}
- 闆娘嚴選價：NT$ ${twdPrice}
- 尺寸建議：${itemSizes ? itemSizes : '（請由 AI 根據圖片自行判斷填寫）'}
- 備註/網址資訊：${itemNotes}

文案寫作要求：
1. 口吻必須溫柔、親切、有日系選品店的質感。
2. 內容必須清楚條列出：商品名稱、闆娘嚴選價、尺寸與顏色建議。
3. 如果備註欄裡面有網址，請在文案的「購買方式」中帶入該網址或提示點擊連結購買。
4. 結尾加上吸引人互動的文句與相關日系穿搭的常用中文 hashtag（如 #日系穿搭 #溫柔風 #選品店 等）。
5. 請直接輸出最終要在 IG 發文的純文字內容即可，絕對不要包含任何 markdown 語法標籤（例如 \`\`\` ）。`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inlineData: { mimeType: mimeType, data: base64Image } }
                            ]
                        }]
                    })
                });

                const resData = await response.json();
                if (resData.candidates && resData.candidates[0].content.parts[0].text) {
                    const aiText = resData.candidates[0].content.parts[0].text;
                    outputText.innerText = aiText;
                    resultBox.style.display = 'block';
                    statusMsg.innerText = '✅ 文案生成成功！正在同步至 Google 試算表...';

                    const finalName = itemName || aiText.split('\n')[0].replace(/[✨✦🌸]/g, '').trim().substring(0, 20);
                    
                    if (sheetUrl) {
                        try {
                            await fetch(sheetUrl, {
                                method: 'POST',
                                mode: 'no-cors',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    name: finalName,
                                    priceJpy: jpyPrice,
                                    priceTwd: twdPrice,
                                    url: itemNotes
                                })
                            });
                            statusMsg.innerText = '🎉 文案已生成，且商品已成功寫入 Google 試算表囉！';
                        } catch (sheetError) {
                            console.error(sheetError);
                            statusMsg.innerText = '✅ 文案已生成，但寫入試算表失敗，請檢查 Apps Script 網址。';
                        }
                    }
                } else {
                    throw new Error('無法解析回應內容');
                }
            } catch (error) {
                console.error(error);
                statusMsg.style.color = 'red';
                statusMsg.innerText = '❌ 錯誤：AI 回傳內容無法解析，請再試一次。';
            }
        };
    }

    function copyText() {
        const text = document.getElementById('outputText').innerText;
        navigator.clipboard.writeText(text);
        alert('📋 文案已複製到剪貼簿！');
    }
</script>

</body>
</html>
