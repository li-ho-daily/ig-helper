<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本衣服上架助手 Pro</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #fcf8f7; color: #5a504e; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 600px; width: 100%; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { font-size: 24px; color: #8c7670; text-align: center; margin-bottom: 25px; font-weight: 400; letter-spacing: 1px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #7a6b67; font-size: 14px; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 12px; border: 1px solid #e6dedc; border-radius: 8px; box-sizing: border-box; font-size: 14px; color: #5a504e; background-color: #faf8f7; transition: all 0.3s; }
        input:focus, textarea:focus { outline: none; border-color: #c9b6b0; background-color: #fff; }
        button { width: 100%; padding: 14px; background-color: #bfa8a3; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background-color 0.3s; font-weight: bold; letter-spacing: 1px; }
        button:hover { background-color: #aba09c; }
        .result-box { margin-top: 25px; padding: 20px; background-color: #fcfcfc; border: 1px dashed #e6dedc; border-radius: 8px; display: none; }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .copy-btn { width: auto; padding: 6px 12px; font-size: 12px; background-color: #e6dedc; color: #5a504e; }
        .copy-btn:hover { background-color: #d1c7c4; }
        pre { white-space: pre-wrap; word-wrap: break-word; margin: 0; font-family: inherit; font-size: 14px; line-height: 1.6; color: #4a3f3d; }
        .status { margin-top: 10px; text-align: center; font-size: 14px; font-weight: bold; }
        .hint { font-size: 12px; color: #a19592; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌸 日本衣服上架助手 Pro 🌸</h1>
    
    <div class="form-group">
        <label for="apiKey">Gemini API Key</label>
        <input type="text" id="apiKey" placeholder="請貼上你的 AQ.Ab8R... 金鑰">
    </div>

    <div class="form-group">
        <label for="itemUrl">日本原始商品網址</label>
        <input type="text" id="itemUrl" placeholder="https://zozo.jp/shop/...">
        <div class="hint">* 貼上網址後，AI 會自動去讀取並構思文案</div>
    </div>

    <div class="form-group">
        <label for="imageInput">上傳衣服截圖（選填）</label>
        <input type="file" id="imageInput" accept="image/*">
        <div class="hint">* 如果有截圖可以一起附上，沒截圖只填網址也能跑！</div>
    </div>

    <div class="form-group">
        <label for="jpyPrice">日幣價格 (JPY)</label>
        <input type="number" id="jpyPrice" placeholder="例如：2990">
    </div>

    <button id="generateBtn" onclick="generateContent()">✨ 生成日系清新風文案 ✨</button>

    <div class="status" id="statusMsg"></div>

    <div class="result-box" id="resultBox">
        <div class="result-header">
            <strong>✨ 產出的 IG 文案 ✨</strong>
            <button class="copy-btn" onclick="copyText()">📋 一鍵複製</button>
        </div>
        <pre id="outputText"></pre>
    </div>
</div>

<script>
    // ⚠️ 這裡填入你從 Google Apps Script 複製下來的部署網址
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx-bmbn0nlOBLDqfuXrjtonqUs_Ld-hHR9_vBQ2JTee-hvmGniTo86nNXekJ3cEfw9c/exec";

    window.onload = function() {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) document.getElementById('apiKey').value = savedKey;
    };

    async function generateContent() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const itemUrl = document.getElementById('itemUrl').value.trim();
        const imageFile = document.getElementById('imageInput').files[0];
        const jpyPrice = parseFloat(document.getElementById('jpyPrice').value);
        const statusMsg = document.getElementById('statusMsg');
        const resultBox = document.getElementById('resultBox');
        const outputText = document.getElementById('outputText');

        if (!apiKey) return alert('請先輸入 Gemini API Key！');
        if (!itemUrl && !imageFile) return alert('請至少「輸入日本網址」或「上傳衣服截圖」其中一項！');
        if (!jpyPrice) return alert('請輸入日幣價格！');

        localStorage.setItem('gemini_api_key', apiKey);

        statusMsg.style.color = '#8c7670';
        statusMsg.innerText = '🔮 AI 正在努力分析並構思日系文案中...';
        resultBox.style.display = 'none';

        const twdPrice = Math.round(jpyPrice * 0.3);

        // 基本 Prompt 模板
        let prompt = `你是一位專業的日系清新風格服飾選品闆娘。請幫我撰寫一篇繁體中文的 IG 上架貼文。
要求：
1. 風格口吻：溫柔、清新、日系質感、像在跟朋友分享好物。
2. 內容必須包含以下資訊：
- 商品名稱
- 闆娘嚴選價：NT$ ${twdPrice}
- 尺寸與顏色建議
- 日本商品代購連結：${itemUrl ? itemUrl : '歡迎私訊小盒子詢問'}
3. 結尾加上吸引人互動的文句與相關日系穿搭的 hashtag（如 #日系穿搭 #溫柔風 #選品店 等）。
請直接輸出最終發文的文案內容即可，不需包含任何額外的說明標籤。`;

        let requestBody = { contents: [] };

        if (imageFile) {
            // 有圖片的情況：使用多模態輸入
            const reader = new FileReader();
            reader.readAsDataURL(imageFile);
            reader.onloadend = async function() {
                const base64Image = reader.result.split(',')[1];
                const mimeType = imageFile.type;
                
                let fullPrompt = prompt;
                if (itemUrl) {
                    fullPrompt += `\n另外，這是該商品的日本原始網址：${itemUrl}，請參考網頁內容來精準辨識商品名稱、尺寸與顏色。`;
                } else {
                    fullPrompt += `\n請直接根據這張截圖來辨識衣服的名稱與特色。`;
                }

                requestBody.contents.push({
                    parts: [
                        { text: fullPrompt },
                        { inlineData: { mimeType: mimeType, data: base64Image } }
                    ]
                });
                await callGeminiAPI(apiKey, requestBody, jpyPrice, twdPrice, itemUrl, statusMsg, resultBox, outputText);
            };
        } else {
            // 只有網址的情況：純文字 Prompt
            prompt += `\n這是該商品的日本原始網址：${itemUrl}。請根據這個網址代表的服飾特色、名稱進行文案發想。`;
            requestBody.contents.push({
                parts: [{ text: prompt }]
            });
            await callGeminiAPI(apiKey, requestBody, jpyPrice, twdPrice, itemUrl, statusMsg, resultBox, outputText);
        }
    }

    async function callGeminiAPI(apiKey, requestBody, jpy, twd, url, statusMsg, resultBox, outputText) {
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            const resData = await response.json();
            if (resData.candidates && resData.candidates[0].content.parts[0].text) {
                const aiText = resData.candidates[0].content.parts[0].text;
                outputText.innerText = aiText;
                resultBox.style.display = 'block';
                statusMsg.innerText = '✅ 文案生成成功！正在同步至 Google 試算表...';

                const itemName = aiText.split('\n')[0].replace('✨', '').trim();

                if (WEB_APP_URL && WEB_APP_URL.includes('macros')) {
                    sendToGoogleSheet(itemName, jpy, twd, url);
                } else {
                    statusMsg.innerText = '✅ 文案生成成功！（未設定試算表連網址）';
                }
            } else {
                throw new Error('API 回傳格式不正確');
            }
        } catch (error) {
            console.error(error);
            statusMsg.style.color = 'red';
            statusMsg.innerText = '❌ 生成失敗，請檢查 API Key 是否正確或重試。';
        }
    }

    async function sendToGoogleSheet(name, jpy, twd, url) {
        const statusMsg = document.getElementById('statusMsg');
        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, priceJpy: jpy, priceTwd: twd, url: url })
            });
            statusMsg.innerText = '🎉 文案已生成，且成功同步到 Google 試算表囉！';
        } catch (error) {
            console.error(error);
            statusMsg.innerText = '✅ 文案已生成，但試算表同步失敗。';
        }
    }

    function copyText() {
        const text = document.getElementById('outputText').innerText;
        navigator.clipboard.writeText(text);
        alert('📋 文案已複製到剪貼簿！');
    }
</script>

</body>
</html>
